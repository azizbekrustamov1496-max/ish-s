<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ish Hisobi"><title>Ish Hisobi</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--cd:#0e1a38;--bd:#1b2d5a;--bl:#1f6bff;--gr:#17c47c;--pu:#8b5cf6;--tx:#e9eefc;--mu:#8ea1cc;--rd:#ff5d6c}
body{background:radial-gradient(120% 60% at 50% 0,#10265a,#050b1c 60%) fixed;color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 110px}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
button:disabled{opacity:.4}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:26px}h2{font-size:17px;margin:18px 0 10px}h3{margin-bottom:8px}
small{color:var(--mu);font-size:12.5px;display:block}
.chip{display:flex;gap:6px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:4px 10px 4px 4px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;flex:none}
.chip .av{width:26px;height:26px;font-size:12px}
.card{display:block;width:100%;text-align:left;background:linear-gradient(160deg,#10204a,#0b1630);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.pr{display:flex;align-items:center;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--bd);font-size:13.5px}
.pc .av{margin-bottom:4px}.c0{background:linear-gradient(160deg,#0f4aa8,#0b2a66)}.c1{background:linear-gradient(160deg,#5b2fb0,#2a1560)}
.big{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0c5a4a,#0b2f3a);border:1px solid #14705a;border-radius:18px;padding:14px;margin-bottom:12px}
.big b,.b2{font-size:27px;display:block}.hero{background:linear-gradient(135deg,#12c795,#1f6bff);border:0}
.row{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rt{display:flex;align-items:center;gap:10px;justify-content:space-between}.rt>div{flex:1}.rt b{display:block}
.tm{text-align:right;font-size:13px;flex:none!important}.tm em{display:block;color:var(--mu);font-style:normal;font-size:11px}
.ra{display:flex;gap:8px;margin-top:8px}.ra button{flex:1;padding:8px;border-radius:10px;background:#16295a;font-size:13px}.ra .dl{color:var(--rd);background:#2a1a30}
.pri,.gh{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;margin:6px 0 12px;text-align:center}
.pri{background:var(--bl);box-shadow:0 6px 20px #1f6bff55}.gh{background:var(--cd);border:1px solid var(--bd)}
.two .pri,.two .gh{margin:0}
label{display:block;margin:12px 0 6px;font-weight:600}
input,textarea{width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}
textarea{height:70px;resize:none}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wk button,.tabs button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-weight:600}
.wk .on,.tabs .on{background:var(--bl);border-color:var(--bl)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tabs button{justify-content:center;padding:11px}
.st{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}.st button{background:var(--cd);border:1px solid var(--bd);border-radius:12px;font-size:22px}.st input{text-align:center}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;border-radius:14px;background:#0c3b3a;border:1px solid #14705a}.tot b{font-size:20px}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.qs button{padding:14px 0;border-radius:12px;background:var(--bl);font-weight:700;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .wd{color:var(--mu);font-size:12px;font-style:normal;padding:4px}
.cal button{aspect-ratio:1;border-radius:50%;position:relative}.cal .td{border:1px solid var(--bl)}.cal .on{background:var(--bl)}
.cal .has:after{content:"";position:absolute;bottom:3px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--gr)}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}.cn button{font-size:22px;padding:0 12px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tl div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.tl b{font-size:20px;display:block}
.ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--gr) calc(var(--p)*1%),#1b2d5a 0);display:grid;place-items:center;margin-top:6px}
.ring i{width:36px;height:36px;border-radius:50%;background:#0b1630;display:grid;place-items:center;font-size:11px;font-style:normal}
.bd{font-style:normal;font-size:12px;padding:4px 10px;border-radius:10px;background:#3a2a2a;color:#ffb3b3;margin-left:auto}.bd.g{background:#0d4d36;color:#7dffc4}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#08122ccc;backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav div{display:flex;width:100%;max-width:460px}nav button{flex:1;font-size:10.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:19px}nav .on{color:#4d8dff}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:#0a1530;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);width:100%;max-width:460px;max-height:92vh;overflow:auto}
.fc{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.fc button{padding:8px 14px;border-radius:18px;background:var(--cd);border:1px solid var(--bd);white-space:nowrap;font-weight:600}.fc .on{background:var(--bl);border-color:var(--bl)}
.dlg{border-radius:24px;margin:0 14px calc(env(safe-area-inset-bottom) + 14px);width:calc(100% - 28px);text-align:center;animation:up .22s ease;background:linear-gradient(160deg,#122552,#0a1530);border:1px solid var(--bd);box-shadow:0 20px 60px #000a}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dlg .ic{font-size:38px;margin-bottom:6px}.dlg h3{font-size:20px;margin-bottom:6px}.dlg small{font-size:14px}.dlg input{margin:16px 0 6px;text-align:center;font-size:17px}.dlg .two{margin:14px 0 0}.dlg .two button{margin:0}
.dng{background:var(--rd)!important;box-shadow:0 6px 20px #ff5d6c55!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--gr);color:#032;padding:10px 18px;border-radius:20px;font-weight:700;z-index:9}
.splash{text-align:center;padding-top:12vh}.logo{font-size:64px}.splash h1{font-size:38px;margin:8px 0}
.lk{display:flex;justify-content:space-between;width:100%;padding:14px;border-bottom:1px solid var(--bd);text-align:left}

(fp?'':`<h2>Sheriklar bo'yicha</h2><div class=two>${S.P.map((p,i)=>{const a=o.filter(e=>e.pair===p.id),pc=t?Math.round(sum(a)/t*100):0;return`<div class="pc c${i%2}">${av(other(p))}<b>${esc(other(p))}</b><span>${f(sum(a))} so'm</span><small style="color:#cde">${cnt(a)} ta ish</small><div class=ring style="--p:${pc}"><i>${pc}%</i></div></div>`}).join('')}</div>`)+
`<h2>Kunlar bo'yicha</h2>`+(Object.keys(days).sort().reverse().map(key=>{const a=days[key].sort((x,y)=>x.ts-y.ts);return`<button class="row lk" style="display:block" data-gday="${key}"><div class=rt><div><b>${dlab(key)}</b><small>${tm(a[0].ts)} – ${tm(a[a.length-1].ts)} • ${[...new Set(a.map(pn))].map(esc).join(', ')}</small></div><span class=tm style="font-size:14px"><b>${f(sum(a))} so'm</b>${cnt(a)} ta</span></div></button>`}).join('')||'<small>Hali ish yo\'q</small>')}
function hist(){if(!S.P.length)return head('Tarix','Bajarilgan ishlar tarixi',0)+empty();const y=S.cal.getFullYear(),m=S.cal.getMonth(),all=S.E.filter(e=>!S.flt||e.pair===S.flt),has=new Set(all.map(e=>dk(e.ts))),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
let g=['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(d=>`<i class=wd>${d}</i>`).join('')+'<i></i>'.repeat(first);
for(let d=1;d<=n;d++){const key=y+'-'+p2(m+1)+'-'+p2(d);g+=`<button class="${key==S.day?'on ':''}${has.has(key)?'has ':''}${key==dk(Date.now())?'td':''}" data-day="${key}">${d}</button>`}
const de=all.filter(e=>dk(e.ts)===S.day).sort((a,b)=>a.ts-b.ts);
return head('Tarix','Bajarilgan ishlar tarixi',0)+fchips(1)+`<div class=card><div class=cn><button data-cal=-1>‹</button>${y} – ${MON[m]}<button data-cal=1>›</button></div><div class=cal>${g}</div></div>
<h2>${dlab(S.day)}</h2><div class=tl><div><b>${cnt(de)}</b><small>Ishlar soni</small></div><div><b>${f(sum(de))}</b><small>Jami summa (so'm)</small></div></div>${de.map(e=>row(e)).join('')||'<small>Bu kuni ish yozilmagan</small>'}`}
function partners(){const o=S.E.filter(e=>!e.mid);
return head('Sheriklar',`${S.P.length} kishi bilan ishlagansiz`,0)+`<div class="big hero"><span style="font-size:34px">🤝</span><div><small style="color:#dff">Hamma sheriklar bo'yicha (joriy oylik)</small><b>${f(sum(o))} so'm</b><small style="color:#dff">${cnt(o)} ta ish</small></div></div><h2>Sheriklar (${S.P.length})</h2>`+
S.P.map(p=>{const a=o.filter(e=>e.pair===p.id),n=other(p);return`<div class=card><button class=pr style="width:100%;text-align:left" data-pick="${p.id}">${av(n)}<div><b>${esc(n)}</b><small>${cnt(a)} ta ish • ${f(sum(a))} so'm</small></div>${p.closed?'<em class=bd>Yopilgan</em>':'<em class="bd g">Ochiq</em>'}</button>${p.edited?`<small style="margin-top:6px">✎ tahrirlangan: ${dt2(p.edited)}</small>`:''}<div class=ra><button data-ep="${p.id}">✎ Tahrirlash</button><button class=dl data-dp="${p.id}">🗑 O'chirish</button></div></div>`}).join('')+`<button class=pri data-act=addp>+ Sherik qo'shish</button>`}
function month(){const p=P();if(!p)return head('Oylik hisob','Oylikni boshqarish')+empty();const o=OP(),ms=S.M.filter(m=>m.pair===p.id).sort((a,b)=>b.closedAt-a.closedAt);
return head('Oylik hisob','Oylikni boshqarish',0)+`<div class="big hero"><span style="font-size:34px">🏦</span><div><small style="color:#dff">Umumiy oylik (hamma sheriklar)</small><b>${f(sum(S.E.filter(e=>!e.mid)))} so'm</b><small style="color:#dff">${cnt(S.E.filter(e=>!e.mid))} ta ish • ${S.P.length} ta sherik</small></div></div>`+fchips(0)+`<div class=card><div class=rt><div><small>Joriy oylik</small><span class=b2>${f(sum(o))} so'm</span><small>${cnt(o)} ta ish</small></div><em class="bd ${p.closed?'':'g'}">${p.closed?'Yopilgan':'Ochiq'}</em></div></div>
<div class=two><button class=pri data-act=open ${p.closed?'':'disabled'}>Oylikni ochish</button><button class=gh data-act=close ${p.closed?'disabled':''}>Oylikni yopish</button></div><h2>Oylik tarix</h2>`+
(ms.map(m=>`<div class=card><b>${esc(m.label)}</b><small>Yopildi • ${f(m.total)} so'm • ${m.count} ta ish</small><small>${Math.max(0,Math.ceil((m.expireAt-Date.now())/864e5))} kundan keyin avtomatik o'chadi</small></div>`).join('')||'<small>Hali yopilgan oylik yo\'q</small>')}
const set=()=>head('Sozlamalar','Profil va ulanish',0)+`<div class="card pr">${av(S.me)}<div><b>${esc(S.me)}</b><small>Sizning hisobingiz</small></div></div>
<label>Standart ish narxi (so'm)</label><input id=dp type=number inputmode=numeric value="${S.price}"><div style="height:12px"></div>
<div class=card style="padding:0"><div class=lk>☁️ Firebase bilan sinxronlash <em class="bd g">Ulangan</em></div><button class=lk data-act=cfg>🔧 Firebase sozlamasini o'zgartirish</button><button class=lk data-act=exit style="border:0">⏏ Chiqish (ismni almashtirish)</button></div><small style="text-align:center;margin-top:18px">Birga ishlash – katta natija!</small>`;
const splash=()=>`<div class=splash><div class=logo>🧮</div><h1>Ish Hisobi</h1><p>Birga ishlaymiz –<br>birga hisoblaymiz!</p><label style="text-align:left;margin-top:36px">Ismingizni yozing</label><input id=nm placeholder="Masalan: Azizbek" autocomplete=off><button class=pri style="margin-top:14px" data-act=name>Boshlash</button><small>Sherigingiz ham o'z ismini yozadi</small></div>`;
const setup=()=>`<div class=splash style="padding-top:6vh"><div class=logo>☁️</div><h1 style="font-size:28px">Firebase ulash</h1><small>Firebase konsolidan «firebaseConfig» kodini nusxalab qo'ying</small><textarea id=cf style="height:200px;margin-top:16px" placeholder='{ apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }'></textarea><button class=pri style="margin-top:14px" data-act=savecfg>Ulash</button></div>`;
const nav=()=>`<nav><div>${[['home','🏠','Asosiy'],['partners','👥','Sheriklar'],['total','💰','Jami'],['hist','📅','Tarix'],['month','🗓','Oylik'],['set','⚙️','Sozlama']].map(([i,e,l])=>`<button class="${S.page==i?'on':''}" data-go=${i}><span>${e}</span>${l}</button>`).join('')}</div></nav>`;
function draw(force){const a=document.activeElement;if(!force&&a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.id)return;let h;
if(!cfg)h=setup();else if(!S.me)h=splash();else h=({home,add,total,hist,partners,month,set})[S.page]();
$('#app').innerHTML=h+(cfg&&S.me&&S.page!='add'?nav():'')+(S.sheet?`<div class=ov><div class=sh><h3>Tahrirlash</h3>${form()}<button class=pri data-act=save>Saqlash</button><button class=gh data-act=cancel>Bekor qilish</button></div></div>`:'')}
const acts={
add(){S.f={pair:S.pair||S.P[0]?.id||'',c:1,pr:S.price,nt:'',dt:dtl(Date.now())};S.added=[];S.page='add'},
async save(){const F=S.f,c=Math.max(1,parseInt(F.c)||0),pr=Math.max(0,+F.pr||0),ts=F.dt?new Date(F.dt).getTime():Date.now();
if(S.sheet){await updateDoc(doc(db,'entries',S.sheet),{pair:F.pair,users:S.P.find(p=>p.id===F.pair).users,count:c,price:pr,note:F.nt||'',ts,edited:Date.now()});S.sheet=null;toast('Saqlandi')}
else if(await addE(c,pr,F.nt||'',ts)){L.price=S.price=pr;S.f={...F,c:1,nt:'',dt:dtl(Date.now())};toast('Saqlandi')}},
cancel(){S.sheet=null},
async close(){const p=P(),o=OP();if(!o.length)return toast("Yopish uchun ish yo'q");if(!await ask('Oylikni yopamizmi?',"Hisob saqlanadi va 2 oydan keyin avtomatik o'chib ketadi.",{ok:'Yopish',ic:'🔒'}))return;
const ts=o.map(e=>e.ts),a=new Date(Math.min(...ts)),z=new Date(Math.max(...ts)),ex=new Date();ex.setMonth(ex.getMonth()+2);const mr=doc(collection(db,'months')),b=writeBatch(db),by={};
people(p).forEach(n=>{const x=o.filter(e=>k(e.worker)===k(n));by[n]={c:cnt(x),s:sum(x)}});
b.set(mr,{pair:p.id,users:p.users,label:`${a.getDate()} ${MON[a.getMonth()]} – ${z.getDate()} ${MON[z.getMonth()]} ${z.getFullYear()}`,total:sum(o),count:cnt(o),by,closedAt:Date.now(),expireAt:ex.getTime()});
o.forEach(e=>b.update(doc(db,'entries',e.id),{mid:mr.id}));b.update(doc(db,'pairs',p.id),{closed:true});await b.commit();toast('Oylik yopildi')},
async open(){await updateDoc(doc(db,'pairs',P().id),{closed:false});toast('Yangi oylik ochildi')},
async addp(){const n=await ask('Yangi sherik',"Sherikning ismini yozing. U o'z ismini xuddi shunday yozadi.",{inp:'',ph:'Masalan: Shoxrux',ok:"Qo'shish",ic:'👥'});if(!n||k(n)===k(S.me))return;const id=pid(S.me,n);
await setDoc(doc(db,'pairs',id),{users:[k(S.me),k(n)].sort(),names:{[k(S.me)]:S.me,[k(n)]:n}},{merge:true});S.pair=L.pair=id;S.f.pair=id},
name(){const n=$('#nm').value.trim();if(!n)return;L.me=S.me=n;start()},
exit(){L.removeItem('me');location.reload()},cfg(){L.removeItem('fbcfg');location.reload()},
savecfg(){try{cfg=Function('return '+$('#cf').value.match(/\{[\s\S]*\}/)[0])();L.fbcfg=JSON.stringify(cfg);location.reload()}catch(e){alert("Kod noto'g'ri. Qavs { } bilan to'liq nusxalang.")}}};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-day],[data-gday],[data-cal],[data-ed],[data-del],[data-w],[data-step],[data-q],[data-act],[data-pick],[data-mode],[data-pp],[data-flt],[data-ep],[data-dp]');if(!t)return;const d=t.dataset;
if(d.go){S.page=d.go;S.sheet=null}else if(d.pick){S.pair=S.flt=L.pair=d.pick;S.page='total'}else if(d.gday){S.day=d.gday;S.cal=new Date(d.gday+'T00:00');S.page='hist'}
else if(d.day)S.day=d.day;else if(d.cal)S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+ +d.cal,1);
else if(d.ed){const x=S.E.find(e=>e.id===d.ed);S.f={pair:x.pair,c:x.count,pr:x.price,nt:x.note||'',dt:dtl(x.ts)};S.sheet=x.id}
else if(d.del){if(await ask("Ishni o'chiramizmi?","Bu yozuv qaytarib bo'lmaydi.",{ok:"O'chirish",danger:1}))await deleteDoc(doc(db,'entries',d.del))}
else if(d.ep){const p=S.P.find(x=>x.id===d.ep),kk=p.users.find(u=>u!==k(S.me))||p.users[0],n=await ask('Sherikni tahrirlash',"Ko'rinadigan ismni o'zgartiring.",{inp:other(p),ok:'Saqlash',ic:'✎'});if(n)await setDoc(doc(db,'pairs',p.id),{names:{[kk]:n},edited:Date.now()},{merge:true})}
else if(d.dp){const p=S.P.find(x=>x.id===d.dp);if(await ask(esc(other(p))+" bilan hammasini o'chiramizmi?","Bu sherik bilan hamma ishlar va oyliklar o'chib ketadi, sherigingizda ham. Qaytarib bo'lmaydi.",{ok:"O'chirish",danger:1})){const rf=[...S.E.filter(e=>e.pair===p.id).map(e=>doc(db,'entries',e.id)),...S.M.filter(m=>m.pair===p.id).map(m=>doc(db,'months',m.id)),doc(db,'pairs',p.id)];for(let i=0;i<rf.length;i+=400){const b=writeBatch(db);rf.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}if(S.flt===p.id)S.flt='';if(S.pair===p.id)S.pair=''}}
else if(d.pp)S.f.pair=d.pp;else if('flt' in d){S.flt=d.flt;if(d.flt)S.pair=d.flt}else if(d.step)S.f.c=Math.max(1,(+S.f.c||0)+ +d.step);
else if(d.q){if(await addE(+d.q,+S.f.pr||0,'',Date.now()))toast('+'+d.q)}
else if(d.mode)S.mode=d.mode;else if(d.act)try{await acts[d.act]()}catch(x){alert('Xato: '+x.message)}
draw(1)});
document.addEventListener('input',e=>{const t=e.target;if(['c','pr','nt','dt'].includes(t.id)){S.f[t.id]=t.value;const x=$('#tot');if(x)x.textContent=f((+S.f.c||0)*(+S.f.pr||0))+" so'm"}});
document.addEventListener('change',e=>{if(e.target.id=='dp'){L.price=S.price=Math.max(0,+e.target.value||100)}});
const TABS=['home','partners','total','hist','month','set'];let tx=0,ty=0,sw=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;sw=e.touches.length==1&&!e.target.closest('input,textarea,.fc,.ov')},{passive:true});
document.addEventListener('touchend',e=>{if(!sw||S.sheet||!cfg||!S.me)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,i=TABS.indexOf(S.page);if(i<0||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;const j=i+(dx<0?1:-1);if(j<0||j>=TABS.length)return;S.page=TABS[j];draw(1);scrollTo(0,0)},{passive:true});
if(cfg)try{db=getFirestore(initializeApp(cfg));start()}catch(e){L.removeItem('fbcfg');cfg=null}
draw(1);
</script></body></html>
